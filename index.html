<script>
  // Admin butonuna veya paneline erişim kontrolü
  function adminGiris() {
    const sifre = prompt("Admin Paneline Giriş İçin Şifre Giriniz:");
    if (sifre === "SizinGizliSifreniz123") {
      alert("Giriş başarılı!");
      // Admin panelini görünür yap veya yönlendir
      document.getElementById("admin-panel").style.display = "block";
    } else {
      alert("Hatalı şifre!");
    }
  }
</script>
